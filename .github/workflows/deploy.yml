name: Deploy to GitHub Pages

# Builds the game and publishes dist/ to Pages on every push to main.
# Pages is served from the Actions artifact, so dist/ stays out of the repo.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish Pages, nothing more.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel a run that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
